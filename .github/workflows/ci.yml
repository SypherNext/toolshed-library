# Runs the unit tests, the database test and the browser tests for the finished app.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toolshed
          POSTGRES_PASSWORD: toolshed
          POSTGRES_DB: toolshed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolshed -d toolshed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://toolshed:toolshed@localhost:5432/toolshed
      # Test-only values: nothing real is protected by them.
      BETTER_AUTH_SECRET: ci-only-secret-used-for-tests-and-nothing-else
      BETTER_AUTH_URL: http://localhost:18846
      CRON_SECRET: ci-only-cron-secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Toolshed <reminders@toolshed.test>
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
